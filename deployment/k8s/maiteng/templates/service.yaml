apiVersion: v1
kind: Service
metadata:
  name: {{ include "maiteng.fullname" . }}  
  labels:
    {{- include "maiteng.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "maiteng.selectorLabels" . | nindent 4 }}
